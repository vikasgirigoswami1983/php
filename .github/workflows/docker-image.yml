name: Docker Build and Save Artifact

on:
  workflow_dispatch:
    inputs:
      run_checkout:
        description: 'Run Checkout Job'
        required: false
        default: 'true'
      run_build:
        description: 'Run Build Job'
        required: false
        default: 'true'
      run_save:
        description: 'Run Save Job'
        required: false
        default: 'true'
      run_upload:
        description: 'Run Upload Job'
        required: false
        default: 'true'

jobs:
  # 1️⃣ Checkout repository
  checkout:
    if: ${{ github.event.inputs.run_checkout == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      repo-path: ${{ steps.repo-path.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        id: repo-path

      - name: List files for debug
        run: ls -al

  # 2️⃣ Build and push Docker image
  build-docker:
    if: ${{ github.event.inputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    needs: [checkout]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: List files for debug
        run: ls -al

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest

  # 3️⃣ Save Docker image locally as tar
  save-docker:
    if: ${{ github.event.inputs.run_save == 'true' }}
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save Docker image to tar
        run: docker save ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest -o my-image.tar

  # 4️⃣ Upload Docker image tar as artifact
  upload-artifact:
    if: ${{ github.event.inputs.run_upload == 'true' }}
    runs-on: ubuntu-latest
    needs: [save-docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-docker-image
          path: my-image.tar
          retention-days: 7

# .github/workflows/docker-build-and-save.yml
name: Docker Build and Save Artifact

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest

      # 4️⃣ Save Docker image as tar file
      - name: Save Docker image to tar
        run: docker save ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest -o my-image.tar

      # 5️⃣ Upload Docker image tar as artifact
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-docker-image
          path: my-image.tar
          retention-days: 7   # optional, default is 90 days

name: PHP Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'   # or whatever version your app uses
          extensions: mbstring, pdo, pdo_mysql, intl
          coverage: none

      # Validate composer.json and composer.lock
      - name: Validate Composer files
        run: composer validate --strict

      # Install dependencies
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader

      # Run tests (optional)
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox || echo "No tests found"

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/php-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/php-app:${{ github.run_number }}

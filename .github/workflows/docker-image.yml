name: Docker Build and Save Artifact

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # 1️⃣ Log in to Docker Hub
  docker-login:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # 2️⃣ Build and push Docker image
  build-docker:
    runs-on: ubuntu-latest
    needs: docker-login
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List files for debug
        run: ls -al

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest

  # 3️⃣ Save Docker image locally as tar
  save-docker:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save Docker image to tar
        run: docker save ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest -o my-image.tar

  # 4️⃣ Upload Docker image tar as artifact
  upload-artifact:
    runs-on: ubuntu-latest
    needs: save-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-docker-image
          path: my-image.tar
          retention-days: 7
